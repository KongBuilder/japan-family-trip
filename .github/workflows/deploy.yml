name: Test and deploy Japan Family Trip OS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: japan-pages
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: |
          test -s index.html
          grep -qi '<html' index.html
          test -s tests/smoke.cjs
          node --check tests/smoke.cjs
          node --check features.js
          node --check advanced.js
          node --check dashboard.js
          node --check audit.js
          node -e "const fs=require('fs');const vm=require('vm');const h=fs.readFileSync('index.html','utf8');const script=h.split('<script>')[1]?.split('</script>')[0];if(!script)process.exit(1);new vm.Script(script);console.log('Inline script syntax OK')"
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile acceptance
        run: node tests/smoke.cjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report failure context
        if: failure()
        run: |
          echo 'Acceptance failed. Review the first failing step and browser exception above.'
          node --version
          npm --version
          git rev-parse HEAD
  deploy:
    needs: acceptance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
