<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Japan Family Trip OS 6</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif;color:#1d2a3a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding-bottom:85px}header{background:linear-gradient(120deg,#174a70,#257b95);color:white;padding:22px 16px 24px}header h1{font-size:23px;margin:3px 0}header small{opacity:.88}.wrap{max-width:850px;margin:auto;padding:12px}.card{background:white;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #2030400b}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.muted{color:#657588;font-size:13px}.pill{border-radius:30px;background:#e8f3fa;color:#24607c;padding:5px 9px;font-size:12px}button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:#e8f1f7;color:#145170;cursor:pointer}button.primary{background:#146987;color:white}button.danger{background:#fff0ee;color:#ad352a}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f6a53b}input,select,textarea{width:100%;border:1px solid #d6e0e9;border-radius:10px;padding:11px;background:white;color:#1d2a3a}label{font-size:13px;color:#586a7a;display:block;margin:10px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#edf5fa;padding:12px;border-radius:12px}.stat b{display:block;font-size:20px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0}.tabs button{white-space:nowrap}.tabs .on{background:#146987;color:white}.item{border-left:4px solid #c2dce8;padding:12px 12px 12px 16px;background:#fafcfe;border-radius:10px;margin:12px 0}.item.done{opacity:.65;border-color:#3d9b7a}.item h3{font-size:16px;margin:3px 0}.item p{margin:6px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:8px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #d9e4ed;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottom button{background:transparent;font-size:12px;padding:9px 7px}.bottom .on{color:#0c6b9b;font-weight:700}dialog{border:0;border-radius:18px;width:min(94vw,540px);max-height:85vh;overflow:auto;padding:20px;box-shadow:0 20px 80px #10203055}dialog::backdrop{background:#10203088}h2{font-size:19px;margin:0 0 12px}.hide{display:none!important}.notice{background:#fff8e7;border-radius:10px;padding:10px;color:#7a5d20;font-size:13px}.tiny{font-size:12px}.full{width:100%}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.wrap{padding:18px}.bottom{max-width:850px;margin:auto;border-radius:15px 15px 0 0}}</style></head><body><header><div class="wrap"><small>🇯🇵 家庭旅行执行助手 · 本机离线版</small><h1>Japan Family Trip OS 6.0</h1><div id="subtitle">京都 → 富士山 → 东京 → 大阪</div></div></header><main class="wrap"><div id="notice" class="notice">建议活动不是预订记录。所有酒店、交通、营业时间、门票及推车条件均须核实。</div><section id="home" class="page"></section><section id="days" class="page hide"></section><section id="bookings" class="page hide"></section><section id="money" class="page hide"></section><section id="settings" class="page hide"></section></main><nav class="bottom"><button data-tab="home" class="on">🏠 总览</button><button data-tab="days">🗓 每日</button><button data-tab="bookings">🎫 预订</button><button data-tab="money">💴 预算</button><button data-tab="settings">⚙️ 设置</button></nav><dialog id="editor"><h2 id="editorTitle">编辑</h2><form id="editForm"><div id="editFields"></div><div class="actions"><button type="button" id="cancelEdit">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><script>
'use strict';const KEY='japan-family-os-v5',oldKey='japan-family-os-v1';const cities=[['京都',4,3],['富士山',3,2],['东京',5,4],['大阪',5,4]];const seeds={京都:[[['14:00','抵达京都及入住','先休息，傍晚酒店附近散步'],['18:00','酒店附近晚餐','不跨区赶路']],[['09:30','清水寺周边','坡道与台阶较多，推车路线待核实'],['12:00','午餐及休息','预留90分钟'],['14:30','祇园慢游','视体力缩短']],[['09:30','岚山渡月桥','竹林人多可跳过'],['12:00','岚山午餐','避开高峰'],['14:30','咖啡馆或回酒店','轻松休息']],[['09:30','京都自由活动','转场日避免远距离景点'],['12:30','前往富士山地区','交通方式待确认']]],富士山:[[['12:00','前往富士五湖','行李与车次待确认'],['16:00','湖畔散步','天气好才安排']],[['09:30','河口湖周边','先看天气与能见度'],['12:00','午餐休息','安排室内休息'],['14:30','湖区自由活动','只选一个重点']],[['09:30','早餐与退房','留足交通缓冲'],['12:00','前往东京','班次待确认']]],东京:[[['14:00','入住东京酒店','附近熟悉环境'],['18:00','附近晚餐','不要赶路']],[['09:30','浅草寺周边','慢游'],['12:00','午餐与休息','预留90分钟'],['14:30','隅田川附近散步','按天气调整']],[['10:00','上野公园','公园与博物馆择一'],['13:00','午餐及休息','下午弹性安排']],[['09:00','主题乐园或自由活动','大型项目全天只选一个，门票待确认']],[['09:30','退房与自由活动','避免远距离景点'],['13:00','前往大阪','车票待确认']]],大阪:[[['14:00','大阪入住','酒店附近休息'],['18:00','道顿堀晚餐','拥挤可换附近餐厅']],[['09:30','大阪城公园','控制步行距离'],['12:00','午餐及休息','避免连续赶路'],['15:00','梅田自由活动','购物或咖啡馆']],[['10:00','大阪海游馆','门票待确认'],['13:00','天保山午餐','下午自由']],[['09:00','环球影城或自由日','全天一个重点，门票待确认']],[['10:00','轻松购物与整理行李','按航班调整'],['14:00','机场交通','班次与航班待确认']]]};const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateISO=(s,n)=>{if(!s)return '日期待确认';let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function fresh(){let days=[],i=0;for(let [city,n] of cities){for(let j=0;j<n;j++){let activities=(seeds[city][j]||[]).map(x=>({id:uid(),time:x[0],title:x[1],note:x[2],duration:90,transport:'待确认',cost:0,done:false,status:'建议',family:true,stroller:'未知',rain:'待确认'}));days.push({id:uid(),city,index:j+1,offset:i++,hotel:'待确认',activities})}}return {version:5,start:'',people:4,days,bookings:[],expenses:[],fx:0.031,budget:0,updated:new Date().toISOString()}}let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||state.version!==5||!Array.isArray(state.days))state=fresh();let selected=0,tab='home';function save(){const previous=state.updated;state.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){state.updated=previous;alert('本机储存失败，请立即导出备份：'+e.message);return false}}const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP',{maximumFractionDigits:0}),rm=n=>'RM '+Number(n||0).toFixed(2);const moneyTotal=()=>state.expenses.reduce((n,e)=>n+(+e.amount||0)*(e.currency==='JPY'?state.fx:1),0);const planTotal=()=>state.days.reduce((n,d)=>n+d.activities.reduce((v,a)=>v+(+a.cost||0),0),0);function counts(){return {activities:state.days.reduce((n,d)=>n+d.activities.length,0),done:state.days.reduce((n,d)=>n+d.activities.filter(a=>a.done).length,0),pending:state.bookings.filter(b=>b.status!=='已预订').length}}function card(s){return '<div class="card">'+s+'</div>'}function navDay(i){selected=Math.max(0,Math.min(state.days.length-1,i));tab='days';render()}function searchTrip(){const q=document.getElementById('tripSearch').value.trim().toLocaleLowerCase();const box=document.getElementById('tripResults');if(!q){box.innerHTML='<p class="muted">输入酒店、景点、交通或备注关键词。</p>';return}let hits=[];state.days.forEach((d,i)=>{if((d.city+' '+d.hotel).toLocaleLowerCase().includes(q))hits.push({i,title:d.city+' 第'+d.index+'天 · 酒店：'+d.hotel});d.activities.forEach(a=>{if([a.title,a.note,a.transport,a.rain].join(' ').toLocaleLowerCase().includes(q))hits.push({i,title:d.city+' D'+d.index+' · '+a.time+' '+a.title})})});state.bookings.forEach(b=>{if([b.name,b.type,b.ref].join(' ').toLocaleLowerCase().includes(q))hits.push({i:-1,title:'预订：'+b.name})});box.innerHTML=hits.length?hits.slice(0,60).map(x=>'<button style="display:block;width:100%;text-align:left;margin:5px 0" onclick="'+(x.i<0?"tab='bookings';render()":'navDay('+x.i+')')+'">'+esc(x.title)+'</button>').join(''):'<p class="muted">没有找到匹配项目</p>'}
function openActivityMap(i){const a=state.days[selected].activities[i];const query=[a.title,state.days[selected].city,'日本'].filter(Boolean).join(' ');window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query),'_blank','noopener,noreferrer')}
async function shareTrip(){const lines=['日本家庭旅行',state.people+'人 · '+(state.start||'日期待确认'),...state.days.map(d=>d.city+' D'+d.index+' · '+(d.hotel||'酒店待确认')+'\n'+d.activities.map(a=>'  '+a.time+' '+a.title).join('\n'))];const message=lines.join('\n');try{if(navigator.share)await navigator.share({title:'日本家庭旅行',text:message});else if(navigator.clipboard){await navigator.clipboard.writeText(message);alert('行程已复制，可粘贴到 WhatsApp')}else prompt('复制行程',message)}catch(e){if(e.name!=='AbortError')alert('分享失败：'+e.message)}}
function pendingList(){let entries=[];state.days.forEach((d,i)=>{if(!d.hotel||d.hotel==='待确认')entries.push({i,text:d.city+' D'+d.index+' · 酒店待确认'});d.activities.forEach(a=>{if(a.status==='待确认'||a.transport==='待确认')entries.push({i,text:d.city+' D'+d.index+' · '+a.title+' · '+(a.transport==='待确认'?'交通待确认':'活动待确认')})})});state.bookings.forEach(b=>{if(b.status!=='已预订')entries.push({i:-1,text:'预订待确认：'+b.name})});return entries}
function render(){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('hide',e.id!==tab));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('on',e.dataset.tab===tab));const c=counts();document.getElementById('subtitle').textContent=`${state.people} 人 · ${state.days.length} 个城市行程日 · 京都 → 富士山 → 东京 → 大阪`;document.getElementById('home').innerHTML=card(`<h2>🔎 全行程搜索</h2><input id="tripSearch" type="search" placeholder="搜索景点、酒店、交通、备注" oninput="searchTrip()"><div id="tripResults"><p class="muted">可跨四个城市快速找到行程</p></div><div class="actions"><button onclick="shareTrip()">分享全行程</button></div>`)+card(`<h2>📌 待确认事项</h2><p class="muted">${pendingList().length} 项需要核实。以下显示前 12 项。</p>${pendingList().slice(0,12).map(x=>'<button style="display:block;width:100%;text-align:left;margin:5px 0" onclick="'+(x.i<0?"tab='bookings';render()":'navDay('+x.i+')')+'">'+esc(x.text)+'</button>').join('')||'<p>暂无待确认事项</p>'}`)+card(`<h2>旅行总览</h2><div class="grid"><div class="stat">行程日<b>${state.days.length}</b></div><div class="stat">活动完成<b>${c.done}/${c.activities}</b></div><div class="stat">待确认预订<b>${c.pending}</b></div><div class="stat">已记录支出<b>${rm(moneyTotal())}</b></div></div><p class="muted">⚠️ 出发日期尚未核实，默认不填写。17 个城市行程日不等于已核实的旅行天数，城市间转场可能重叠。</p><button class="primary" onclick="navDay(0)">查看每日行程</button> <button onclick="printTrip()">打印 / 保存 PDF</button>`)+card(`<h2>四城轻松路线</h2>${cities.map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #edf0f4"><b>${x[0]}</b><span>${x[1]}D${x[2]}N</span><button onclick="navDay(${state.days.findIndex(d=>d.city===x[0])})">查看</button></div>`).join('')}`)+card(`<h2>旅行风险提示</h2><p>⚠️ 酒店、火车、航班和门票未录入时，一律视为待确认。</p><p>⚠️ 推车友好必须以实际车站电梯、坡道和景点设施为准。</p><p>⚠️ 汇率仅为可修改的计算示例，不是实时汇率。</p>`);
const d=state.days[selected];document.getElementById('days').innerHTML=card(`<div class="row"><h2>每日时间轴</h2><span class="pill">${esc(d.city)} D${d.index}</span></div><label>快速切换日期</label><select id="daySelect">${state.days.map((x,i)=>`<option value="${i}" ${i===selected?'selected':''}>${dateISO(state.start,x.offset)} · ${x.city} 第${x.index}天</option>`).join('')}</select><div class="row" style="margin-top:12px"><button onclick="navDay(${selected-1})" ${selected===0?'disabled':''}>← 前一天</button><b>${dateISO(state.start,d.offset)}</b><button onclick="navDay(${selected+1})" ${selected===state.days.length-1?'disabled':''}>后一天 →</button></div><p class="muted">酒店：${esc(d.hotel)} <button onclick="editHotel()">编辑</button></p><div class="grid"><div class="stat">活动<b>${d.activities.length}</b></div><div class="stat">完成<b>${d.activities.filter(a=>a.done).length}</b></div><div class="stat">活动预算<b>${rm(d.activities.reduce((n,a)=>n+(+a.cost||0),0))}</b></div><div class="stat">未核实<b>${d.activities.filter(a=>a.status!=='已预订').length}</b></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="editActivity(-1)">＋ 新活动</button><button onclick="resetDay()">恢复当日建议</button><button onclick="sortDay()">按时间排序</button><button onclick="openMapSelected()">城市地图</button></div>`)+card(`<div class="row"><h2>活动安排</h2><select id="activityFilter" style="width:auto"><option value="all">全部</option><option value="family">亲子友好</option><option value="stroller">推车已核实</option><option value="pending">未预订</option></select></div><div id="activityList"></div>`);document.getElementById('daySelect').onchange=e=>navDay(+e.target.value);document.getElementById('activityFilter').onchange=renderActivities;renderActivities();document.getElementById('bookings').innerHTML=card(`<div class="row"><h2>预订及票券</h2><button class="primary" onclick="editBooking(-1)">＋ 新增</button></div><p class="muted">只有手动确认的项目才标记已预订。勿在共享文件中保存完整护照或付款卡资料。</p>${state.bookings.length?state.bookings.map((b,i)=>`<div class="item"><b>${esc(b.name)}</b> <span class="pill">${esc(b.status)}</span><p class="muted">${esc(b.date)} · ${esc(b.type)} · ${esc(b.ref)}</p><button onclick="editBooking(${i})">编辑</button> <button class="danger" onclick="removeBooking(${i})">删除</button></div>`).join(''):'<p>暂无预订记录。请录入真实酒店、航班及车票。</p>'}`);
document.getElementById('money').innerHTML=card(`<h2>预算总览</h2><div class="grid"><div class="stat">已记录支出<b>${rm(moneyTotal())}</b></div><div class="stat">活动计划<b>${rm(planTotal())}</b></div><div class="stat">总预算<b>${rm(state.budget)}</b></div><div class="stat">预算余额<b>${rm(state.budget-moneyTotal())}</b></div></div><p class="muted">活动计划与已记录支出分开显示，不直接相加，避免同一项目重复计算。JPY 按手动汇率折算。</p><button onclick="editBudget()">修改预算和汇率</button> <button class="primary" onclick="editExpense(-1)">＋ 记一笔</button>`)+card(`<h2>支出账本</h2>${state.expenses.length?state.expenses.map((e,i)=>`<div class="item"><b>${esc(e.name)}</b> · ${e.currency==='JPY'?yen(e.amount):rm(e.amount)}<p class="muted">${esc(e.date)} · ${esc(e.note)}</p><button onclick="editExpense(${i})">编辑</button> <button class="danger" onclick="removeExpense(${i})">删除</button></div>`).join(''):'暂无实际支出'}`);
document.getElementById('settings').innerHTML=card(`<h2>行程设置</h2><label>出发日期（待确认可留空）</label><input type="date" id="startDate" value="${esc(state.start)}"><label>旅行人数</label><input type="number" min="1" max="30" id="people" value="${state.people}"><button class="primary" id="saveSettings" style="margin-top:12px">保存并更新所有日期</button><p class="muted">调整起始日期会重新计算每天显示的日期，不会删除活动。酒店与车票的实际预订日期不会自动改动。</p>`)+card(`<h2>资料安全</h2><p class="muted">⚠️ 请在 iPhone Safari 中定期下载 JSON 备份。浏览器清除网站数据会删除本机行程。</p><p class="muted">资料保存在当前浏览器本机，换设备不会自动同步。每次重要修改后请导出 JSON 备份。</p><button onclick="exportData()">导出 JSON 备份</button> <button onclick="document.getElementById('importFile').click()">导入备份</button><input id="importFile" type="file" accept="application/json,.json" class="hide"><p class="muted">最后修改：${esc(state.updated)}</p><button class="danger" onclick="resetAll()">清空并恢复默认行程</button><p class="muted">如果在 iPhone 文件预览中无法操作，请将 HTML 放到 HTTPS 网站。单机离线版本不支持多设备同步。</p>`);document.getElementById('saveSettings').onclick=()=>{const dt=document.getElementById('startDate').value,p=+document.getElementById('people').value;if((dt&&!/^\d{4}-\d{2}-\d{2}$/.test(dt))||!Number.isInteger(p)||p<1||p>30)return alert('日期或人数无效');state.start=dt;state.people=p;save();render()};document.getElementById('importFile').onchange=importData}
function renderActivities(){let f=document.getElementById('activityFilter').value;let a=state.days[selected].activities.map((x,i)=>({...x,i})).filter(x=>f==='all'||f==='family'&&x.family||f==='stroller'&&x.stroller==='已核实'||f==='pending'&&x.status!=='已预订');document.getElementById('activityList').innerHTML=a.length?a.map(x=>`<div class="item ${x.done?'done':''}"><div class="row"><b>${esc(x.time)} · ${esc(x.title)}</b><span class="pill">${esc(x.status)}</span></div><p class="muted">⏱ ${x.duration} 分钟 · 🚉 ${esc(x.transport)} · ${rm(x.cost)}</p><p>${esc(x.note)}</p><p class="muted">🌧 ${esc(x.rain)} · 推车：${esc(x.stroller)} · ${x.family?'亲子建议':'亲子待核实'}</p><div class="actions"><button onclick="toggleDone(${x.i})">${x.done?'↩ 未完成':'✓ 完成'}</button><button onclick="editActivity(${x.i})">编辑</button> <button onclick="openActivityMap(${x.i})">地图</button><button onclick="moveActivity(${x.i},-1)">↑</button><button onclick="moveActivity(${x.i},1)">↓</button><button class="danger" onclick="deleteActivity(${x.i})">删除</button></div></div>`).join(''):'<p class="muted">没有符合筛选的活动</p>'}
function openMapSelected(){const d=state.days[selected];const q=encodeURIComponent(d.city+' 日本');window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener,noreferrer')}function sortDay(){state.days[selected].activities.sort((a,b)=>a.time.localeCompare(b.time));save();render()}function toggleDone(i){let a=state.days[selected].activities[i];a.done=!a.done;save();render()}function moveActivity(i,delta){let a=state.days[selected].activities,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}function deleteActivity(i){if(confirm('确定删除此活动？')){state.days[selected].activities.splice(i,1);save();render()}}function resetDay(){if(!confirm('将替换当日活动，现有编辑会丢失。继续？'))return;let freshDay=fresh().days[selected];state.days[selected].activities=freshDay.activities;save();render()}
const field=(name,label,value,type='text',opts=[])=>`<label>${esc(label)}</label>${type==='select'?`<select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}" rows="3">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''} ${type==='optional'?'':'required'}>`}`;function openEditor(title,html,fn){document.getElementById('editorTitle').textContent=title;document.getElementById('editFields').innerHTML=html;const dialog=document.getElementById('editor');document.getElementById('editForm').onsubmit=e=>{e.preventDefault();let snapshot=JSON.stringify(state);let f=Object.fromEntries(new FormData(e.target));if(fn(f)!==false){if(save()){dialog.close();render()}else{state=JSON.parse(snapshot)}}};dialog.showModal()}document.getElementById('cancelEdit').onclick=()=>document.getElementById('editor').close();function editHotel(){openEditor('住宿资料',field('hotel','酒店名称（未预订请写待确认）',state.days[selected].hotel),f=>{state.days[selected].hotel=f.hotel})}
function editActivity(i){let a=i<0?{time:'10:00',title:'',note:'',duration:60,transport:'待确认',cost:0,status:'建议',stroller:'未知',rain:'待确认',family:true,done:false}:state.days[selected].activities[i];openEditor(i<0?'新增活动':'编辑活动',field('time','时间',a.time,'time')+field('title','活动名称',a.title)+field('duration','分钟',a.duration,'number')+field('transport','交通',a.transport)+field('cost','预计费用 MYR',a.cost,'number')+field('status','状态',a.status,'select',['建议','待确认','已预订'])+field('stroller','推车条件',a.stroller,'select',['未知','已核实','不适合'])+field('family','亲子建议',a.family?'是':'否','select',['是','否'])+field('rain','雨天替代',a.rain,'optional')+field('note','备注',a.note,'textarea'),f=>{if(!f.title.trim()||!Number.isFinite(+f.duration)||+f.duration<0||!Number.isFinite(+f.cost)||+f.cost<0)return false;let item={...a,...f,duration:+f.duration,cost:+f.cost,family:f.family==='是',id:a.id||uid()};if(i<0)state.days[selected].activities.push(item);else state.days[selected].activities[i]=item})}
function editBooking(i){let a=i<0?{name:'',type:'酒店',date:state.start,ref:'',status:'待确认'}:state.bookings[i];openEditor(i<0?'新增预订':'编辑预订',field('name','名称',a.name)+field('type','类别',a.type,'select',['酒店','航班','铁路','巴士','门票','其他'])+field('date','日期',a.date,'date')+field('ref','参考编号（可留空）',a.ref,'optional')+field('status','状态',a.status,'select',['待确认','已预订','已取消']),f=>{if(!f.name.trim())return false;let b={...a,...f,id:a.id||uid()};if(i<0)state.bookings.push(b);else state.bookings[i]=b})}function removeBooking(i){if(confirm('删除这项预订？')){state.bookings.splice(i,1);save();render()}}
function editExpense(i){let a=i<0?{name:'',amount:0,currency:'JPY',date:state.start,note:''}:state.expenses[i];openEditor(i<0?'新增支出':'编辑支出',field('name','项目',a.name)+field('amount','金额',a.amount,'number')+field('currency','币种',a.currency,'select',['JPY','MYR'])+field('date','日期',a.date,'date')+field('note','备注',a.note,'optional'),f=>{if(!f.name.trim()||!Number.isFinite(+f.amount)||+f.amount<0)return false;let x={...a,...f,amount:+f.amount,id:a.id||uid()};if(i<0)state.expenses.push(x);else state.expenses[i]=x})}function removeExpense(i){if(confirm('删除支出？')){state.expenses.splice(i,1);save();render()}}function editBudget(){openEditor('预算与汇率',field('budget','旅行总预算 MYR',state.budget,'number')+field('fx','1 JPY = 多少 MYR（手动输入）',state.fx,'number'),f=>{if(!Number.isFinite(+f.fx)||+f.fx<=0||!Number.isFinite(+f.budget)||+f.budget<0)return false;state.budget=+f.budget;state.fx=+f.fx})}
function printTrip(){let w=window.open('','_blank');if(!w){alert('浏览器阻止新窗口，请允许弹出窗口');return}let html='<html><meta charset="utf-8"><title>日本家庭旅行行程</title><style>body{font-family:sans-serif;padding:22px;line-height:1.6}section{page-break-inside:avoid;border-bottom:1px solid #ccc;padding:8px}small{color:#555}</style><h1>日本家庭旅行行程</h1><p>出发日期：'+esc(state.start||'待确认')+' · 人数：'+state.people+'</p>';state.days.forEach(d=>{html+='<section><h2>'+esc(d.city)+' 第'+d.index+'天 · '+dateISO(state.start,d.offset)+'</h2><p>酒店：'+esc(d.hotel)+'</p>'+d.activities.map(a=>'<p>'+esc(a.time)+' '+esc(a.title)+' <small>'+esc(a.note)+' · '+esc(a.status)+'</small></p>').join('')+'</section>'});w.document.write(html+'</html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='japan-family-trip-backup-'+(state.start||'undated')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(x.version!==5||!Array.isArray(x.days)||!Array.isArray(x.bookings)||!Array.isArray(x.expenses)||x.days.length>100||x.days.some(d=>!Array.isArray(d.activities)||d.activities.length>200)||typeof x.start!=='string'||!Number.isFinite(+x.fx)||+x.fx<=0)throw Error('备份格式不符');if(!confirm('导入将覆盖当前本机行程。请先导出备份。确定？'))return;const previous=state;state=x;selected=0;if(!save()){state=previous;throw Error('浏览器储存失败，已保留原有行程')}render()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}}function resetAll(){if(confirm('确定清空本机所有行程、预订和支出？请先导出 JSON 备份。此操作不可撤销。')){state=fresh();selected=0;save();render()}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});save();render();</script><script src="features.js" defer></script><script src="advanced.js" defer></script></body></html>
